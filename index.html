<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Playground</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-dim: #1f6feb22;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; }

    /* ── Layout ── */
    #app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; overflow: hidden; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header .logo { font-weight: 600; font-size: 15px; letter-spacing: -0.3px; }
    header .logo span { color: var(--accent); }
    header .sep { flex: 1; }
    header .badge {
      font-size: 11px; padding: 2px 8px; border-radius: 20px;
      background: var(--accent-dim); color: var(--accent); border: 1px solid #1f6feb55;
    }
    #run-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--accent); color: #0f1117; border: none;
      padding: 6px 14px; border-radius: 6px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    #run-btn:hover { opacity: 0.85; }
    #run-btn:disabled { opacity: 0.4; cursor: default; }
    #run-btn svg { width: 13px; height: 13px; }

    /* ── Body ── */
    #body { display: grid; grid-template-columns: 220px 1fr; overflow: hidden; }

    /* ── Sidebar ── */
    aside {
      border-right: 1px solid var(--border);
      overflow-y: auto; padding: 12px 0;
      background: var(--surface);
    }
    .sidebar-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted);
      padding: 0 14px 8px;
    }
    .table-group { margin-bottom: 6px; }
    .table-name {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; user-select: none; transition: background 0.1s;
      color: var(--text);
    }
    .table-name:hover { background: #ffffff08; }
    .table-name .t-icon { color: var(--accent); font-size: 10px; }
    .table-name .arrow { margin-left: auto; color: var(--text-muted); font-size: 10px; transition: transform 0.15s; }
    .table-name.open .arrow { transform: rotate(90deg); }
    .columns { display: none; padding: 2px 0 6px; }
    .table-name.open + .columns { display: block; }
    .col-row {
      display: flex; align-items: center; gap: 6px;
      padding: 3px 14px 3px 28px; font-size: 11px; color: var(--text-muted);
    }
    .col-type { color: var(--yellow); font-size: 10px; margin-left: auto; }
    .col-pk { color: var(--accent); font-size: 9px; font-weight: 700; margin-left: 4px; }

    /* quick queries */
    .qquery-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted);
      padding: 14px 14px 8px;
    }
    .qquery {
      padding: 5px 14px; font-size: 11px; color: var(--accent);
      cursor: pointer; font-family: var(--font-mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background 0.1s;
    }
    .qquery:hover { background: #ffffff08; }

    /* ── Main ── */
    main { display: grid; grid-template-rows: 1fr 1fr; overflow: hidden; }

    /* ── Editor ── */
    #editor-wrap {
      display: flex; flex-direction: column;
      border-bottom: 1px solid var(--border); overflow: hidden;
    }
    #editor-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    #editor-bar span { font-size: 11px; color: var(--text-muted); }
    #editor-bar .shortcut { margin-left: auto; font-size: 11px; color: var(--text-muted); }
    kbd {
      display: inline-block; padding: 1px 5px; border-radius: 3px;
      background: #ffffff0d; border: 1px solid var(--border);
      font-size: 10px; font-family: var(--font-sans);
    }
    #editor {
      flex: 1; resize: none; border: none; outline: none;
      background: var(--bg); color: var(--text);
      font-family: var(--font-mono); font-size: 13px;
      line-height: 1.7; padding: 16px 20px;
      tab-size: 2; width: 100%;
    }
    #editor::selection { background: #1f6feb55; }

    /* ── Results ── */
    #results-wrap { display: flex; flex-direction: column; overflow: hidden; }
    #results-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    #results-bar span { font-size: 11px; color: var(--text-muted); }
    #status { font-size: 11px; margin-left: auto; }
    #status.ok { color: var(--green); }
    #status.err { color: var(--red); }
    #results-scroll { flex: 1; overflow: auto; }

    /* ── Table ── */
    #result-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #result-table thead th {
      position: sticky; top: 0; background: var(--surface);
      padding: 8px 16px; text-align: left; font-weight: 600;
      border-bottom: 1px solid var(--border); white-space: nowrap;
      color: var(--text-muted); font-size: 11px; letter-spacing: 0.03em;
    }
    #result-table tbody tr { transition: background 0.1s; }
    #result-table tbody tr:hover { background: #ffffff05; }
    #result-table tbody td {
      padding: 7px 16px; border-bottom: 1px solid #ffffff08;
      font-family: var(--font-mono); color: var(--text); white-space: nowrap;
    }
    #result-table tbody td.null { color: var(--text-muted); font-style: italic; }
    #result-table tbody td.num { color: #79c0ff; }

    /* ── Empty / Error states ── */
    .state-msg {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; gap: 8px;
      color: var(--text-muted); font-size: 13px;
    }
    .state-msg .icon { font-size: 28px; opacity: 0.4; }
    .state-msg.error { color: var(--red); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">SQL <span>Playground</span></div>
    <div class="badge">SQLite · In-Browser</div>
    <div class="sep"></div>
    <button id="run-btn" disabled>
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.5l10 5.5-10 5.5V2.5z"/></svg>
      Run
    </button>
  </header>

  <div id="body">
    <aside id="sidebar">
      <div class="sidebar-label">Schema</div>
      <!-- populated by JS -->
      <div class="qquery-label">Quick Queries</div>
      <div id="quick-queries"><!-- populated by JS --></div>
    </aside>

    <main>
      <div id="editor-wrap">
        <div id="editor-bar">
          <span>Query</span>
          <span class="shortcut"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run</span>
        </div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
          placeholder="-- Write your SQL here&#10;SELECT * FROM employees LIMIT 10;"></textarea>
      </div>

      <div id="results-wrap">
        <div id="results-bar">
          <span>Results</span>
          <span id="status"></span>
        </div>
        <div id="results-scroll">
          <div class="state-msg">
            <div class="icon">⌁</div>
            <div>Run a query to see results</div>
          </div>
        </div>
      </div>
    </main>
  </div>

</div>

<script>
// ── Schema Definition ──────────────────────────────────────────────────────────
const SCHEMA = [
  {
    name: 'employees',
    cols: [
      { name: 'id',         type: 'INTEGER', pk: true },
      { name: 'name',       type: 'TEXT' },
      { name: 'department', type: 'TEXT' },
      { name: 'salary',     type: 'REAL' },
      { name: 'hire_date',  type: 'TEXT' },
    ],
    sql: `CREATE TABLE employees (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  department TEXT NOT NULL,
  salary REAL NOT NULL,
  hire_date TEXT NOT NULL
);`,
    data: [
      [1,'Alice Chen','Engineering',120000,'2019-03-15'],
      [2,'Bob Martin','Engineering',115000,'2020-07-01'],
      [3,'Carol White','Marketing',85000,'2018-11-20'],
      [4,'David Kim','Engineering',130000,'2017-06-10'],
      [5,'Emma Davis','HR',75000,'2021-01-05'],
      [6,'Frank Lopez','Marketing',90000,'2019-09-30'],
      [7,'Grace Park','Engineering',125000,'2020-02-14'],
      [8,'Henry Brown','HR',72000,'2022-04-22'],
      [9,'Isla Scott','Marketing',88000,'2021-08-18'],
      [10,'James Lee','Engineering',140000,'2016-12-01'],
    ]
  },
  {
    name: 'departments',
    cols: [
      { name: 'id',     type: 'INTEGER', pk: true },
      { name: 'name',   type: 'TEXT' },
      { name: 'budget', type: 'REAL' },
      { name: 'head',   type: 'TEXT' },
    ],
    sql: `CREATE TABLE departments (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  budget REAL NOT NULL,
  head TEXT
);`,
    data: [
      [1,'Engineering',2000000,'James Lee'],
      [2,'Marketing',800000,'Frank Lopez'],
      [3,'HR',400000,'Emma Davis'],
    ]
  },
  {
    name: 'products',
    cols: [
      { name: 'id',       type: 'INTEGER', pk: true },
      { name: 'name',     type: 'TEXT' },
      { name: 'category', type: 'TEXT' },
      { name: 'price',    type: 'REAL' },
      { name: 'stock',    type: 'INTEGER' },
    ],
    sql: `CREATE TABLE products (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  category TEXT NOT NULL,
  price REAL NOT NULL,
  stock INTEGER NOT NULL
);`,
    data: [
      [1,'Laptop Pro 16','Electronics',1499.99,34],
      [2,'Wireless Mouse','Electronics',39.99,210],
      [3,'Standing Desk','Furniture',699.00,15],
      [4,'Notebook (A5)','Stationery',4.99,500],
      [5,'USB-C Hub','Electronics',59.99,88],
      [6,'Ergonomic Chair','Furniture',349.00,22],
      [7,'Whiteboard Markers','Stationery',8.99,300],
      [8,'Monitor 27"','Electronics',399.00,45],
    ]
  },
  {
    name: 'orders',
    cols: [
      { name: 'id',         type: 'INTEGER', pk: true },
      { name: 'product_id', type: 'INTEGER' },
      { name: 'quantity',   type: 'INTEGER' },
      { name: 'total',      type: 'REAL' },
      { name: 'order_date', type: 'TEXT' },
      { name: 'customer',   type: 'TEXT' },
    ],
    sql: `CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  product_id INTEGER NOT NULL,
  quantity INTEGER NOT NULL,
  total REAL NOT NULL,
  order_date TEXT NOT NULL,
  customer TEXT NOT NULL,
  FOREIGN KEY (product_id) REFERENCES products(id)
);`,
    data: [
      [1,1,2,2999.98,'2024-01-10','Alice Chen'],
      [2,2,5,199.95,'2024-01-12','Bob Martin'],
      [3,3,1,699.00,'2024-01-15','Carol White'],
      [4,5,3,179.97,'2024-01-18','David Kim'],
      [5,8,2,798.00,'2024-01-20','Grace Park'],
      [6,4,10,49.90,'2024-01-22','Emma Davis'],
      [7,6,1,349.00,'2024-01-25','Frank Lopez'],
      [8,1,1,1499.99,'2024-01-28','Isla Scott'],
      [9,2,8,319.92,'2024-02-01','Henry Brown'],
      [10,8,1,399.00,'2024-02-03','James Lee'],
      [11,5,2,119.98,'2024-02-05','Alice Chen'],
      [12,3,2,1398.00,'2024-02-10','David Kim'],
    ]
  }
];

const QUICK_QUERIES = [
  { label: 'All employees',         sql: 'SELECT * FROM employees;' },
  { label: 'Avg salary by dept',    sql: 'SELECT department,\n       ROUND(AVG(salary), 2) AS avg_salary\nFROM employees\nGROUP BY department\nORDER BY avg_salary DESC;' },
  { label: 'Top earners',           sql: 'SELECT name, salary\nFROM employees\nORDER BY salary DESC\nLIMIT 5;' },
  { label: 'Products low stock',    sql: "SELECT name, stock\nFROM products\nWHERE stock < 30\nORDER BY stock;" },
  { label: 'Revenue by product',    sql: 'SELECT p.name, SUM(o.quantity) AS units_sold,\n       ROUND(SUM(o.total), 2) AS revenue\nFROM orders o\nJOIN products p ON p.id = o.product_id\nGROUP BY p.id\nORDER BY revenue DESC;' },
  { label: 'Dept budget vs payroll',sql: 'SELECT d.name,\n       d.budget,\n       SUM(e.salary) AS payroll,\n       ROUND(SUM(e.salary) / d.budget * 100, 1) || \'%\' AS pct\nFROM departments d\nJOIN employees e ON e.department = d.name\nGROUP BY d.id;' },
];

// ── Build Sidebar ──────────────────────────────────────────────────────────────
function buildSidebar() {
  const aside = document.getElementById('sidebar');
  const label = aside.querySelector('.sidebar-label');
  const qqLabel = aside.querySelector('.qquery-label');
  const qqDiv = document.getElementById('quick-queries');

  SCHEMA.forEach(table => {
    const group = document.createElement('div');
    group.className = 'table-group';

    const tname = document.createElement('div');
    tname.className = 'table-name';
    tname.innerHTML = `<span class="t-icon">▤</span>${table.name}<span class="arrow">›</span>`;
    tname.addEventListener('click', () => {
      tname.classList.toggle('open');
    });

    const cols = document.createElement('div');
    cols.className = 'columns';
    table.cols.forEach(col => {
      const row = document.createElement('div');
      row.className = 'col-row';
      row.innerHTML = `<span>${col.name}</span>${col.pk ? '<span class="col-pk">PK</span>' : ''}<span class="col-type">${col.type}</span>`;
      cols.appendChild(row);
    });

    group.appendChild(tname);
    group.appendChild(cols);
    aside.insertBefore(group, qqLabel);
  });

  QUICK_QUERIES.forEach(q => {
    const d = document.createElement('div');
    d.className = 'qquery';
    d.textContent = q.label;
    d.title = q.sql;
    d.addEventListener('click', () => {
      document.getElementById('editor').value = q.sql;
    });
    qqDiv.appendChild(d);
  });
}

// ── Init SQL.js ────────────────────────────────────────────────────────────────
let db = null;

async function initDB() {
  const SQL = await initSqlJs({
    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${file}`
  });

  db = new SQL.Database();

  SCHEMA.forEach(table => {
    db.run(table.sql);
    const placeholders = table.cols.map(() => '?').join(', ');
    const stmt = db.prepare(`INSERT INTO ${table.name} VALUES (${placeholders})`);
    table.data.forEach(row => stmt.run(row));
    stmt.free();
  });

  document.getElementById('run-btn').disabled = false;
  setStatus('Ready', 'ok');
}

// ── Run Query ──────────────────────────────────────────────────────────────────
function runQuery() {
  const sql = document.getElementById('editor').value.trim();
  if (!sql || !db) return;

  const scroll = document.getElementById('results-scroll');
  const t0 = performance.now();

  try {
    const results = db.exec(sql);
    const ms = (performance.now() - t0).toFixed(1);

    if (!results.length) {
      scroll.innerHTML = '<div class="state-msg"><div class="icon">✓</div><div>Query executed — no rows returned</div></div>';
      setStatus(`OK · ${ms}ms`, 'ok');
      return;
    }

    const { columns, values } = results[results.length - 1];
    const rowCount = values.length;

    const table = document.createElement('table');
    table.id = 'result-table';

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    columns.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col;
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    values.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(val => {
        const td = document.createElement('td');
        if (val === null) {
          td.textContent = 'NULL';
          td.className = 'null';
        } else if (typeof val === 'number') {
          td.textContent = val;
          td.className = 'num';
        } else {
          td.textContent = val;
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.innerHTML = '';
    scroll.appendChild(table);
    setStatus(`${rowCount} row${rowCount !== 1 ? 's' : ''} · ${ms}ms`, 'ok');
  } catch (err) {
    scroll.innerHTML = `<div class="state-msg error"><div class="icon">✕</div><div>${err.message}</div></div>`;
    setStatus('Error', 'err');
  }
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

// ── Wire Up ────────────────────────────────────────────────────────────────────
document.getElementById('run-btn').addEventListener('click', runQuery);
document.getElementById('editor').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runQuery();
  }
  // Tab key → 2 spaces
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart;
    ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 2;
  }
});

buildSidebar();
initDB().catch(err => {
  setStatus('Failed to load SQLite', 'err');
  console.error(err);
});
</script>
</body>
</html>
